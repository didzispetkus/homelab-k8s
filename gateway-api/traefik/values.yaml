# Traefik Helm values for Gateway API (bare-metal k3s)
# Chart: traefik/traefik

# Disable default Ingress class — we use Gateway API only
ingressClass:
  enabled: false
  isDefaultClass: false

# Disable built-in IngressRoute for dashboard — accessed via port-forward only
ingressRoute:
  dashboard:
    enabled: false

# Enable dashboard API on port 9000 (port-forward only, not exposed externally)
api:
  dashboard: true
  insecure: true

# -- See [logs reference](https://doc.traefik.io/traefik/reference/install-configuration/observability/logs-and-accesslogs/)
log:
  level: "INFO" 

# -- See [access logs reference](https://doc.traefik.io/traefik/reference/install-configuration/observability/logs-and-accesslogs/)
accessLog:
  enabled: true
  filters:
    statusCodes: "400-599"
    minDuration: "1s"  

# Disable Prometheus metrics endpoints
metrics:
  prometheus: null

# Enable Gateway API provider
providers:
  kubernetesGateway:
    enabled: true
  kubernetesIngress:
    enabled: false
  kubernetesCRD:
    # Explicitly opt in to collision-safe naming
    safeNaming: true    

# Traefik experimental features
experimental:
  kubernetesGateway:
    # -- Enable traefik experimental GatewayClass CRD
    enabled: true

# Gateway configuration — Traefik will create the Gateway and GatewayClass automatically
gateway:
  enabled: true
  name: main-gateway
  namespace: ""  # defaults to traefik namespace
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-clusterissuer
  listeners:
    web:
      port: 8000
      protocol: HTTP
      namespacePolicy:
        from: All
    websecure:
      port: 8443
      protocol: HTTPS
      namespacePolicy:
        from: All
      certificateRefs:
        - kind: Secret
          name: traefik-wildcard-tls
          namespace: traefik

# LoadBalancer service — MetalLB will assign this IP
service:
  enabled: true
  type: LoadBalancer
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.20.110
  spec:
    externalTrafficPolicy: Local


# Ports — must match listener ports above
ports:
  traefik:
    port: 9000
    expose:
      default: false  # not exposed externally — port-forward only
    exposedPort: 9000
    protocol: TCP
  web:
    port: 8000
    expose:
      default: true
    exposedPort: 80
    protocol: TCP
  websecure:
    port: 8443
    expose:
      default: true
    exposedPort: 443
    protocol: TCP

# Resource limits
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

deployment:
  replicas: null # autoscaling enabled, so replicas are managed by HPA
  spread: true

autoscaling:
  enabled: true
  minReplicas:  1
  maxReplicas:  3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80 

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - traefik
        topologyKey: kubernetes.io/hostname          

# Security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532

# Entry point option isn't exposed via `ports.*`, so pass it as a CLI arg
additionalArguments:
  - "--entryPoints.web.http.aliasHeadersStrategy=delete"
  - "--entryPoints.websecure.http.aliasHeadersStrategy=delete"
  - "--entryPoints.traefik.http.aliasHeadersStrategy=delete"
  - "--entryPoints.metrics.http.aliasHeadersStrategy=delete"